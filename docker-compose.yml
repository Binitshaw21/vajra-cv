version: '3.9'

services:
  vajra-backend:
    build:
      context: .
      dockerfile: Dockerfile.airgap
    container_name: vajra-backend
    environment:
      VAJRA_API_KEY: ${VAJRA_API_KEY:?VAJRA_API_KEY must be set}
      VAJRA_MODEL_SECRET: ${VAJRA_MODEL_SECRET:?VAJRA_MODEL_SECRET must be set}
      VAJRA_API_ROLE: ${VAJRA_API_ROLE:-operator}
      VAJRA_MODEL_REGISTRY: /app/data/model_registry.json
      VAJRA_AUDIT_LOG: /app/logs/audit.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    command: python -m uvicorn engine.api_gateway:app --host 0.0.0.0 --port 8000

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vajra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.3
    container_name: vajra-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage:
