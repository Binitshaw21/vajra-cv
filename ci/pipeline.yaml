name: vajra-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint check
        run: |
          python -m compileall engine core tests
      - name: Run tests
        run: |
          pytest -q
      - name: Confirm deployment config
        run: |
          test -f docker-compose.yml
